apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-db
  namespace: ehr
spec:
  replicas: 1
  selector:
    matchLabels: { app: fhir-db }
  template:
    metadata:
      labels: { app: fhir-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_DB, value: hapi }
            - { name: POSTGRES_USER, value: hapi }
            - { name: POSTGRES_PASSWORD, value: hapi }
          ports:
            - containerPort: 5432
          resources:
            requests: { memory: "96Mi", cpu: "50m" }
            limits: { memory: "200Mi", cpu: "400m" }
          # emptyDir keeps the manifest portable across k3s/EKS (no StorageClass
          # needed). Data is ephemeral, but that's fine: you reload from seed 42.
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fhir-db
  namespace: ehr
spec:
  selector: { app: fhir-db }
  ports:
    - port: 5432
      targetPort: 5432
