apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: clinical-service
  namespace: ehr
spec:
  replicas: 1
  selector:
    matchLabels: { app: clinical-service }
  template:
    metadata:
      labels: { app: clinical-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: clinical-service
          image: 811165583134.dkr.ecr.ap-south-1.amazonaws.com/clinical-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: FHIR_BASE, value: "http://fhir:8080/fhir" }
          ports:
            - containerPort: 8000
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "160Mi", cpu: "500m" }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
  strategy:
    canary:
      # Separate stable/canary Services let the analyzer probe ONLY the canary.
      # Argo injects the pod-template-hash into each service's selector.
      stableService: clinical-service-stable
      canaryService: clinical-service-canary
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - analysis:
            # THE ONE-LINE INDEPENDENT VARIABLE:
            #   infra-gate    = baseline / control arm
            #   clinical-gate = treatment arm (your contribution)
            templates:
              - templateName: infra-gate
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: clinical-service-stable
  namespace: ehr
spec:
  type: NodePort                 # external load target
  selector: { app: clinical-service }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: clinical-service-canary
  namespace: ehr
spec:                            # ClusterIP; the analyzer probes this
  selector: { app: clinical-service }
  ports:
    - port: 8000
      targetPort: 8000
