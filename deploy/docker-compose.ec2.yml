# EC2 validation phase: runs the WHOLE application on a single instance.
# This is pre-contribution validation (functionality/performance/stability),
# NOT the canary experiment (that needs Kubernetes).
services:
  fhir-db:
    image: postgres:16
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
    volumes:
      - fhir-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  fhir:
    image: hapiproject/hapi:latest
    depends_on:
      fhir-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fhir-db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: hapi
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      HAPI_FHIR_FHIR_VERSION: R4
    ports:
      - "8080:8080"

  clinical-service:
    build: ../app/clinical-service
    depends_on:
      - fhir
    environment:
      FHIR_BASE: http://fhir:8080/fhir   # in-network service name
    ports:
      - "8000:8000"

volumes:
  fhir-pgdata:
